name: Verificar backend

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: prueba-local-ci
          POSTGRES_DB: aida_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aida_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
        env:
          CI_DATABASE_URL: postgresql://postgres:prueba-local-ci@127.0.0.1:5432/aida_test
